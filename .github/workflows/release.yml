name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验文档元信息
        run: python scripts/gen_index.py --check

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            FACP 版本发布。协议与文档变更详见 [CHANGELOG.md](CHANGELOG.md)。

            本版本涉及的文档状态见 [README 索引](README.md)。
